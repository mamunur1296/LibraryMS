services:
  postgres:
    image: postgres:15-alpine
    container_name: library_ms_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2025
      POSTGRES_DB: LibraryMS
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d LibraryMS"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - library_ms_network

  redis:
    image: redis:7-alpine
    container_name: library_ms_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - library_ms_network

  db-migrator:
    build:
      context: .
      dockerfile: src/LibraryMS.DbMigrator/Dockerfile
    container_name: library_ms_migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=LibraryMS;Username=postgres;Password=2025
    networks:
      - library_ms_network

  api:
    build:
      context: .
      dockerfile: src/LibraryMS.HttpApi.Host/Dockerfile
    container_name: library_ms_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=LibraryMS;Username=postgres;Password=2025
      - Redis__Configuration=redis:6379
      - Smtp__Host=smtp.mailtrap.io
      - Smtp__Port=587
      - Smtp__Username=your_mailtrap_username
      - Smtp__Password=your_mailtrap_password
      - Smtp__FromEmail=noreply@libraryms.com
      - Smtp__FromName=LibraryMS
      - Smtp__EnableSsl=true
    ports:
      - "8080:8080"
    networks:
      - library_ms_network

networks:
  library_ms_network:
    driver: bridge

volumes:
  postgres_data:
