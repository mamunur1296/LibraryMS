version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: library_ms_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2025
      POSTGRES_DB: LibraryMS
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - library_ms_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library_ms_api
    depends_on:
      - postgres
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=LibraryMS;Username=postgres;Password=2025
    ports:
      - "8080:8080"
    networks:
      - library_ms_network

networks:
  library_ms_network:
    driver: bridge

volumes:
  postgres_data:
